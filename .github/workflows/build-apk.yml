name: Build SilviQuiz Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          unzip -q SilviQuizPro_ANDROID_SOURCE.zip
          echo "Extracted folders:"
          find . -maxdepth 2 -type f | head -50

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16.0

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: SilviQuizProAndroid
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SilviQuizPro-debug-APK
          path: SilviQuizProAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
